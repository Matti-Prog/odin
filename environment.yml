name: odin
channels:
  - pytorch
  - nvidia/label/cuda-11.8.0
  - nvidia
  - pytorch3d
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # torch + cuda runtime
  - pytorch::pytorch=2.3.1
  - pytorch::torchvision=0.18.1
  - pytorch-cuda=11.8

  # cuda compilation
  - cuda-nvcc=11.8.*
  - cuda-cudart-dev=11.8.*
  - cuda-libraries-dev=11.8.*
  - ninja

  # pytorch3d
  - pytorch3d=0.7.8
  - fvcore
  - iopath

  # other
  - hydra-core
  - h5py
  - pytables

  - pip:
      # huggingface
      - transformers==4.39.3
      - tokenizers==0.15.2
      - diffusers==0.33.1
      - accelerate==1.7.0
      - huggingface-hub==0.32.4
      - safetensors==0.5.3

      # smpl
      - smplx==0.1.28
      - transforms3d
      - torchgeometry==0.1.2
      - torch-ema==0.3

      # other
      - trimesh
      - wandb
      - rich
      - loguru